<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#fbfbfd" id="theme-color" />
<meta name="description" content="Life OS · 人生管理系统：把生活拆成可执行的模块，记录、推进、复盘。数据只保存在本机浏览器。" />
<title>Life OS · 人生管理系统</title>
<link rel="stylesheet" href="style.css?v=20261121g" />
<script>
/* 强制 HTTPS：仅在 http 且非本地地址时跳转，file:// 与 localhost 预览不受影响 */
(function () {
  if (location.protocol !== 'http:') return;
  var h = (location.hostname || '').toLowerCase();
  if (!h) return;
  if (h === 'localhost' || h === '127.0.0.1' || h === '::1' || h === '[::1]' || h === '0.0.0.0' ||
      h === '::ffff:127.0.0.1' || /^127\./.test(h) || /\.localhost$/.test(h) || /\.local$/.test(h)) return;
  var url = 'https://' + location.host + location.pathname + location.search + location.hash;
  location.replace(url);
})();
</script>
<script>
/* 主题预设：解析前先定深浅色，避免首帧闪白 / 闪黑。auto 表示跟随系统 */
(function () {
  var mode = 'auto';
  try { mode = localStorage.getItem('lifeos.theme.v1') || 'auto'; } catch (e) { }
  var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia &&
    window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
})();
</script>
<script>
/* 登录门禁：脚本解析前即锁定界面，避免未登录时主界面闪一下 */
(function () {
  var ok = false;
  try { ok = !!localStorage.getItem('lifeos.session.v1'); } catch (e) { ok = false; }
  document.documentElement.className += ok ? ' authed' : ' locked';
})();
</script>
</head>
<body>
  <a class="skip-link" href="#canvas">跳到主要内容</a>

  <!-- 邮箱登录 -->
  <section class="auth" id="auth" hidden>
    <div class="auth-card">
      <div class="auth-mark" id="auth-mark"></div>
      <h1 class="auth-title" id="auth-title">登录 Life OS</h1>
      <p class="auth-sub" id="auth-sub">用邮箱进入你的人生管理系统，数据按邮箱分别保存在本机浏览器。</p>
      <form class="auth-form" id="auth-form" autocomplete="on" novalidate>
        <label class="auth-field">
          <span>邮箱</span>
          <input id="auth-email" type="email" name="email" inputmode="email" autocomplete="username"
                 placeholder="you@example.com" spellcheck="false" required />
        </label>
        <label class="auth-field">
          <span>密码</span>
          <input id="auth-pass" type="password" name="password" autocomplete="current-password"
                 placeholder="至少 4 位，首次登录即创建本地账号" required />
        </label>
        <p class="auth-error" id="auth-error" hidden></p>
        <button class="solid-btn auth-submit" id="auth-submit" type="submit">登录</button>
      </form>
      <p class="auth-note">纯前端演示：账号只记录在本机浏览器，不做服务端校验；换浏览器或清缓存后需重新登录。</p>
      <button class="auth-alt" id="auth-clear" type="button">清除本机账号与数据</button>
    </div>
  </section>

  <div class="app" id="app">
    <!-- 左侧垂直导航 -->
    <aside class="sidebar" id="sidebar" aria-label="主导航">
      <a class="brand" href="#" data-act="home">
        <span class="brand-mark" id="brand-mark"></span>
        <span class="brand-text">
          <strong id="brand-name" title="点击重命名系统名称">Life OS</strong>
          <em id="brand-sub" title="点击重命名副标题">人生管理系统</em>
        </span>
      </a>

      <section class="nav-group" id="group-system">
        <div class="nav-label">
          <button class="nav-fold" id="fold-system" type="button" aria-expanded="true" aria-controls="nav-system">
            <span class="nav-chev" aria-hidden="true"></span>
            <span>系统页</span>
          </button>
        </div>
        <div class="nav-body" id="body-system">
          <div class="nav-body-inner">
            <nav class="nav" id="nav-system"></nav>
          </div>
        </div>
      </section>

      <div class="sidebar-foot">
        <div class="foot-actions">
          <button class="foot-btn" type="button" data-act="export">导出备份</button>
          <button class="foot-btn" type="button" data-act="import">导入</button>
          <button class="foot-btn" type="button" data-act="reset">清空</button>
        </div>
        <div class="user-box">
          <button class="user-mail" id="user-mail" type="button" title="点击修改用户名">未登录</button>
          <button class="user-out" id="btn-logout" type="button">退出</button>
        </div>
        <p class="foot-hint" id="foot-hint">数据保存在本机浏览器，刷新不丢</p>
      </div>
    </aside>

    <div class="scrim" id="scrim"></div>

    <!-- 右侧画布 -->
    <main class="main">
      <header class="topbar" id="topbar">
        <button class="icon-btn menu-btn" id="btn-menu" type="button" aria-label="打开导航"></button>
        <button class="topbar-title" id="page-title" type="button" title="点击重命名当前页">概览</button>

        <div class="topbar-tools">
          <button class="search-btn" id="btn-search" type="button" aria-label="搜索（Command 或 Control 加 K）"
                  aria-keyshortcuts="Meta+K Control+K" title="全局搜索 ⌘K / Ctrl+K">
            <span class="search-ico" id="search-ico"></span>
            <span class="search-label">搜索</span>
            <kbd class="search-kbd">⌘K</kbd>
          </button>
          <button class="icon-btn theme-btn" id="btn-theme" type="button"
                  aria-label="切换外观" title="外观：跟随系统"></button>
        </div>

        <div class="topbar-actions" id="topbar-actions">
          <button class="ghost-btn" id="btn-page-menu" type="button">页签设置</button>
          <button class="solid-btn" id="btn-add-module" type="button">添加模块</button>
        </div>
        <button class="icon-btn actions-toggle" id="btn-actions-toggle" type="button"
                aria-expanded="true" aria-controls="topbar-actions" title="隐藏操作区"></button>
      </header>

      <div class="canvas" id="canvas" tabindex="-1"></div>
    </main>
  </div>

  <!-- 全局搜索 -->
  <div class="cmdk" id="cmdk" hidden>
    <div class="cmdk-panel" role="dialog" aria-modal="true" aria-label="全局搜索">
      <div class="cmdk-bar">
        <span class="cmdk-ico" id="cmdk-ico"></span>
        <input class="cmdk-input" id="cmdk-input" type="text" autocomplete="off" spellcheck="false"
               role="combobox" aria-expanded="true" aria-controls="cmdk-list" aria-autocomplete="list"
               placeholder="搜索页签、模块、待办、习惯、目标、决定…" />
        <button class="cmdk-close" id="cmdk-close" type="button" aria-label="关闭搜索">ESC</button>
      </div>
      <div class="cmdk-list" id="cmdk-list" role="listbox" aria-label="搜索结果"></div>
      <div class="cmdk-foot">
        <span><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
        <span><kbd>↵</kbd> 跳转</span>
        <span><kbd>esc</kbd> 关闭</span>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay" hidden></div>
  <input type="file" id="file-import" accept="application/json,.json" hidden />
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js?v=20261121g"></script>
</body>
</html>
